name: 每日抓取動區

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 台灣 07:00
  workflow_dispatch:        # 也可以在 GitHub 網頁上手動按一次

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 fetch_blocktempo.py
      - name: 存回 repo
        run: |
          git config user.name "blocktempo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json docs/index.html
          git diff --cached --quiet || git commit -m "daily: $(date -u +%F)"
          git push
