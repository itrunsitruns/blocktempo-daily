name: 每日抓取動區

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 fetch_blocktempo.py
      - name: 存回 repo
        run: |
          git config user.name "blocktempo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json docs/index.html
          git diff --cached --quiet || git commit -m "daily: $(date -u +%F)"
          git push
